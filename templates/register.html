{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="panel">
    <h2>Create Account</h2>
    {% if errors %}
        <div class="notice danger-note">
            <ul>
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
    <form class="stack-form" method="POST" action="/register">
        <label>
            <span class="label">Name</span>
            <input name="name" value="{{ name or '' }}" required>
        </label>
        <label>
            <span class="label">Email</span>
            <input type="email" name="email" value="{{ email or '' }}" required>
        </label>
        <label>
            <span class="label">Password</span>
            <input type="password" name="password" required>
        </label>
        <button type="submit">Register</button>
    </form>
</section>
{% endblock %}
